<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="system-ui, sans-serif">
  <rect class="bg" width="800" height="260" fill="#fff"/>
  <text class="t" x="40" y="40" font-size="20" font-weight="700" fill="#171717">One IITM BS term, week by week</text>
  <text class="tm" x="40" y="63" font-size="14" fill="#667085">Content and assignments are online; quizzes and the end-term exam are in person.</text>
  <line class="ln" x1="60" y1="140" x2="700" y2="140" stroke="#e5e7eb" stroke-width="6" stroke-linecap="round"/>
  <g font-size="12" class="tm" fill="#667085" text-anchor="middle">
    <circle class="bg2" cx="60" cy="140" r="11" fill="#eef1f4"/><text x="60" y="171">1</text>
    <circle class="bg2" cx="113" cy="140" r="11" fill="#eef1f4"/><text x="113" y="171">2</text>
    <circle class="bg2" cx="167" cy="140" r="11" fill="#eef1f4"/><text x="167" y="171">3</text>
    <circle class="bg2" cx="220" cy="140" r="11" fill="#eef1f4"/><text x="220" y="171">4</text>
    <circle class="bg2" cx="273" cy="140" r="11" fill="#eef1f4"/><text x="273" y="171">5</text>
    <circle class="bg2" cx="327" cy="140" r="11" fill="#eef1f4"/><text x="327" y="171">6</text>
    <circle class="bg2" cx="380" cy="140" r="11" fill="#eef1f4"/><text x="380" y="171">7</text>
    <circle class="bg2" cx="433" cy="140" r="11" fill="#eef1f4"/><text x="433" y="171">8</text>
    <circle class="bg2" cx="487" cy="140" r="11" fill="#eef1f4"/><text x="487" y="171">9</text>
    <circle class="bg2" cx="540" cy="140" r="11" fill="#eef1f4"/><text x="540" y="171">10</text>
    <circle class="bg2" cx="593" cy="140" r="11" fill="#eef1f4"/><text x="593" y="171">11</text>
    <circle class="bg2" cx="647" cy="140" r="11" fill="#eef1f4"/><text x="647" y="171">12</text>
  </g>
  <text class="tm" x="60" y="196" font-size="12" fill="#667085">Week</text>
  <!-- assignments band -->
  <rect class="teal" x="50" y="88" width="608" height="24" rx="12" fill="#0f766e" opacity="0.85"/>
  <text x="62" y="105" font-size="13" font-weight="600" fill="#fff">Weekly online assignments: best 5 of the first 7 must average 40+ for end-term eligibility</text>
  <!-- quizzes -->
  <rect class="brand" x="226" y="206" width="100" height="34" rx="10" fill="#ffd21c"/>
  <text class="ink" x="276" y="228" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">Quiz 1 · wk 1–4</text>
  <path class="lf" d="M226 158 L240 206" stroke="#171717" stroke-width="1.5"/>
  <rect class="brand" x="440" y="206" width="100" height="34" rx="10" fill="#ffd21c"/>
  <text class="ink" x="490" y="228" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">Quiz 2 · wk 1–8</text>
  <path class="lf" d="M439 158 L455 206" stroke="#171717" stroke-width="1.5"/>
  <rect class="purple" x="640" y="196" width="130" height="44" rx="10" fill="#7c3aed"/>
  <text x="705" y="216" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">End-term exam</text>
  <text x="705" y="232" font-size="11" fill="#fff" text-anchor="middle">after week 12</text>
  <path class="lf" d="M700 140 L705 196" stroke="#171717" stroke-width="1.5"/>
</svg>
