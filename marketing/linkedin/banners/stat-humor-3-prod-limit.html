<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: #FFFFFF;
      color: #0F172A;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      position: relative;
      display: flex;
      align-items: center;
    }

    .banner-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      margin-left: 360px;
      margin-right: 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 55px 0 45px;
    }

    .main-title {
      font-size: 78px;
      font-weight: 900;
      letter-spacing: -3.5px;
      line-height: 0.95;
      color: #0F172A;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .equation-box {
      display: flex;
      align-items: baseline;
      gap: 16px;
      font-family: 'JetBrains Mono', monospace;
    }
    .math-formula {
      font-size: 19px;
      font-weight: 600;
      color: #0F172A;
    }
    .math-condition {
      font-size: 14px;
      color: #64748B;
    }
    .math-condition strong {
      color: #2563EB;
      font-weight: 600;
    }

    .bottom-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      color: #64748B;
    }
    .accent-bar {
      width: 12px;
      height: 2px;
      background: #2563EB;
    }
  </style>
</head>
<body>
  <div class="banner-wrap">
    <div>
      <h1 class="main-title">DATA SCIENTIST</h1>
      
      <div class="equation-box">
        <span class="math-formula">P(Works in Production | Localhost) = ε</span>
        <span class="math-condition">as <strong>ε → 0</strong></span>
      </div>
    </div>

    <div class="bottom-row">
      <span class="accent-bar"></span>
      <span>masuddarrahaman31@gmail.com</span>
    </div>
  </div>
</body>
</html>
