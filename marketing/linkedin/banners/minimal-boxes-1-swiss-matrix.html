<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: #FFFFFF;
      color: #0A0D14;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      position: relative;
      display: flex;
      align-items: center;
    }

    /* Subtle graph paper background grid */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-size: 28px 28px;
      background-image: 
        linear-gradient(to right, #F1F5F9 1px, transparent 1px),
        linear-gradient(to bottom, #F1F5F9 1px, transparent 1px);
    }

    .main-container {
      position: relative;
      z-index: 10;
      width: 100%;
      margin-left: 360px;
      margin-right: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    /* Left Typographic Hero */
    .type-col {
      flex: 1;
    }

    .author-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: #64748B;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .author-tag::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #2563EB;
      border-radius: 2px;
    }

    .headline-big {
      font-size: 82px;
      font-weight: 900;
      letter-spacing: -3.5px;
      line-height: 0.95;
      color: #090D16;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .sub-tagline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      font-weight: 600;
      color: #2563EB;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sub-tagline .sep {
      color: #CBD5E1;
    }

    /* Right Square Boxes Matrix (4 columns x 2 rows) */
    .square-matrix {
      display: grid;
      grid-template-columns: repeat(4, 76px);
      grid-template-rows: repeat(2, 76px);
      gap: 12px;
      padding: 14px;
      background: #FAFAFA;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .sq-box {
      width: 76px;
      height: 76px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      position: relative;
    }

    /* Color variations */
    .sq-cobalt {
      background: #2563EB;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .sq-amber {
      background: #F59E0B;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
    }
    .sq-emerald {
      background: #10B981;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }
    .sq-slate {
      background: #0F172A;
      color: #FFFFFF;
    }
    .sq-violet {
      background: #6366F1;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }

    /* Outlined wireframe boxes */
    .sq-wireframe {
      background: #FFFFFF;
      border: 1.5px solid #CBD5E1;
      color: #475569;
    }
    .sq-wireframe svg {
      color: #2563EB;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="main-container">
    <div class="type-col">
      <div class="author-tag">MASUDDAR RAHAMAN</div>
      <h1 class="headline-big">DATA SCIENTIST</h1>
      <div class="sub-tagline">
        <span>STATISTICAL ML</span>
        <span class="sep">/</span>
        <span>KAIZENSTAT CORE</span>
        <span class="sep">/</span>
        <span>OPEN SOURCE</span>
      </div>
    </div>

    <!-- Geometric Colored & Wireframe Square Matrix (4x2) -->
    <div class="square-matrix">
      <!-- Row 1 -->
      <div class="sq-box sq-cobalt">
        <span style="font-size:16px;">ML</span>
      </div>
      <div class="sq-box sq-wireframe">
        <svg width="30" height="18" viewBox="0 0 100 50" fill="none" stroke="#2563EB" stroke-width="3">
          <path d="M 0 48 Q 30 48 40 30 Q 50 2 60 30 Q 70 48 100 48"/>
        </svg>
      </div>
      <div class="sq-box sq-amber">
        <span style="font-size:18px;">θ*</span>
      </div>
      <div class="sq-box sq-wireframe">
        <span style="color:#64748B; font-size: 13px;">+</span>
      </div>

      <!-- Row 2 -->
      <div class="sq-box sq-wireframe">
        <span style="color:#2563EB; font-size:11px;">[N×D]</span>
      </div>
      <div class="sq-box sq-emerald">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="sq-box sq-slate">
        <span style="font-size:10px; letter-spacing:0.5px;">KAIZEN</span>
      </div>
      <div class="sq-box sq-violet">
        <span style="font-size:16px;">Py</span>
      </div>
    </div>
  </div>
</body>
</html>
