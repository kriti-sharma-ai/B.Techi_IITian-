<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&family=JetBrains+Mono:wght@600;700;800&family=EB+Garamond:ital,wght@0,600;1,500;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: #FFFFFF;
      color: #0B0B0B;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      position: relative;
    }

    .yellow-top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
      background: #FFD21C;
      z-index: 20;
    }

    .bg-math-grid {
      position: absolute;
      inset: 0;
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, #E2E8F0 0.85px, transparent 0.85px),
        linear-gradient(to bottom, #E2E8F0 0.85px, transparent 0.85px);
    }

    /* TOP-LEFT GAUSSIAN FORMULA */
    .top-left-stat-box {
      position: absolute;
      top: 32px;
      left: 50px;
      width: 300px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #CBD5E1;
      border-left: 3.5px solid #FFD21C;
      padding: 10px 14px;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
      z-index: 15;
    }
    .stat-header {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      color: #64748B;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-dot {
      width: 5px;
      height: 5px;
      background: #FFD21C;
      border-radius: 50%;
    }
    .gauss-math {
      font-family: 'EB Garamond', serif;
      font-size: 19px;
      font-style: italic;
      color: #0B0B0B;
      line-height: 1.25;
    }
    .stat-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      color: #64748B;
      margin-top: 4px;
      font-style: normal;
    }

    .main-wrap {
      position: relative;
      z-index: 10;
      height: 100%;
      margin-left: 380px;
      margin-right: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 30px 0;
    }

    .text-column {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 640px;
    }

    .headline {
      font-size: 72px;
      font-weight: 900;
      letter-spacing: -3.2px;
      line-height: 1.02;
      color: #0B0B0B;
      text-transform: uppercase;
    }
    .line-top { white-space: nowrap; }

    .yellow-highlight {
      background: #FFD21C;
      color: #0B0B0B;
      padding: 2px 14px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 4px;
      box-shadow: 0 4px 14px rgba(255, 210, 28, 0.35);
      white-space: nowrap;
    }

    .footer-line {
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      color: #64748B;
    }
    .footer-line strong { color: #0B0B0B; }
    .square-indicator {
      width: 7px;
      height: 7px;
      background: #0B0B0B;
    }

    .venn-container {
      width: 480px;
      height: 290px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="yellow-top-bar"></div>
  <div class="bg-math-grid"></div>

  <!-- Top-Left Normal Distribution Formula -->
  <div class="top-left-stat-box">
    <div class="stat-header">
      <span class="stat-dot"></span>
      <span>NORMAL DISTRIBUTION // N(μ, σ²)</span>
    </div>
    <div class="gauss-math">
      f(x) = (1/σ√(2π)) · e^(-(x-μ)²/2σ²)
    </div>
    <div class="stat-sub">
      E[X] = μ  •  Var(X) = σ²
    </div>
  </div>

  <div class="main-wrap">
    <div class="text-column">
      <div class="headline">
        <div class="line-top">DATA MINDED</div>
        <div><span class="yellow-highlight">&amp; MANAGEMENT.</span></div>
      </div>

      <div class="footer-line">
        <span class="square-indicator"></span>
        <span><strong>kritisharma1481550@gmail.com</strong></span>
        <span>•</span>
        <span>STRATEGY &amp; EXECUTION</span>
      </div>
    </div>

    <!-- 3-Circle Venn Graphic -->
    <div class="venn-container">
      <svg width="450" height="280" viewBox="0 0 450 280" fill="none">
        <defs>
          <clipPath id="f3aClip"><circle cx="170" cy="165" r="90"/></clipPath>
          <clipPath id="f3bClip"><circle cx="280" cy="165" r="90"/></clipPath>
        </defs>

        <circle cx="170" cy="165" r="90" stroke="#0B0B0B" stroke-width="2.5" fill="#FFFFFF" fill-opacity="0.88"/>
        <circle cx="280" cy="165" r="90" stroke="#0B0B0B" stroke-width="2.5" fill="#FFFFFF" fill-opacity="0.88"/>
        <circle cx="225" cy="90" r="90" stroke="#0B0B0B" stroke-width="2.5" fill="#FFFFFF" fill-opacity="0.88"/>

        <g clip-path="url(#f3aClip)">
          <g clip-path="url(#f3bClip)">
            <circle cx="225" cy="90" r="90" fill="#FFD21C"/>
          </g>
        </g>

        <circle cx="170" cy="165" r="90" stroke="#0B0B0B" stroke-width="2.5" fill="none"/>
        <circle cx="280" cy="165" r="90" stroke="#0B0B0B" stroke-width="2.5" fill="none"/>
        <circle cx="225" cy="90" r="90" stroke="#0B0B0B" stroke-width="2.5" fill="none"/>

        <text x="120" y="195" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#0B0B0B" text-anchor="middle">DATA</text>
        <text x="330" y="195" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#0B0B0B" text-anchor="middle">MANAGEMENT</text>
        <text x="225" y="45" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#0B0B0B" text-anchor="middle">STRATEGY</text>

        <circle cx="225" cy="138" r="4.5" fill="#0B0B0B"/>
        <text x="225" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="900" fill="#0B0B0B" text-anchor="middle">EXECUTION</text>
      </svg>
    </div>
  </div>
</body>
</html>
