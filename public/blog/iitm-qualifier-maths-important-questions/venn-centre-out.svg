<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="system-ui, sans-serif">
  <rect class="bg" width="800" height="430" fill="#fff"/>
  <text class="t" x="40" y="40" font-size="20" font-weight="700" fill="#171717">Fill a three-set Venn diagram from the centre out</text>
  <text class="tm" x="40" y="63" font-size="14" fill="#667085">Maths I qualifier, May 2024 Q6 (same question as May 2023 Q7). 500 candidates, 50 know no language.</text>
  <circle class="blue s-blue" cx="250" cy="190" r="105" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2"/>
  <circle class="green s-green" cx="380" cy="190" r="105" fill="#15803d" fill-opacity="0.10" stroke="#15803d" stroke-width="2"/>
  <circle class="purple s-muted" cx="315" cy="295" r="105" fill="#7c3aed" fill-opacity="0.10" stroke="#667085" stroke-width="2"/>
  <g class="t" fill="#171717" font-size="14" font-weight="700">
    <text x="88" y="112">Python 285</text>
    <text x="440" y="84">C 195</text>
    <text x="340" y="418">Java 115</text>
  </g>
  <g class="t" fill="#171717" font-size="18" font-weight="800" text-anchor="middle">
    <text x="205" y="180">190</text>
    <text x="425" y="180">95</text>
    <text x="315" y="350">40</text>
    <text x="315" y="160">50</text>
    <text x="262" y="262">25</text>
    <text x="368" y="262">30</text>
  </g>
  <rect class="brand" x="293" y="203" width="44" height="28" rx="8" fill="#ffd21c"/>
  <text class="ink" x="315" y="223" font-size="16" font-weight="800" fill="#0b0b0b" text-anchor="middle">20</text>
  <g font-size="13">
    <rect class="bg2" x="520" y="90" width="250" height="300" rx="14" fill="#eef1f4"/>
    <text class="t" x="538" y="116" font-weight="800" fill="#171717">Step 1: all three</text>
    <text class="tm" x="538" y="136" fill="#667085">At least one = 500 − 50 = 450</text>
    <text class="tm" x="538" y="156" fill="#667085">450 = 595 − 165 + x, so x = 20</text>
    <text class="t" x="538" y="190" font-weight="800" fill="#171717">Step 2: exactly two</text>
    <text class="tm" x="538" y="210" fill="#667085">P and C only: 70 − 20 = 50</text>
    <text class="tm" x="538" y="230" fill="#667085">P and J only: 45 − 20 = 25</text>
    <text class="tm" x="538" y="250" fill="#667085">C and J only: 50 − 20 = 30</text>
    <text class="t" x="538" y="284" font-weight="800" fill="#171717">Step 3: exactly one</text>
    <text class="tm" x="538" y="304" fill="#667085">Python: 285 − 50 − 25 − 20 = 190</text>
    <text class="tm" x="538" y="324" fill="#667085">C: 195 − 50 − 30 − 20 = 95</text>
    <text class="tm" x="538" y="344" fill="#667085">Java: 115 − 25 − 30 − 20 = 40</text>
    <text class="t" x="538" y="374" font-weight="800" fill="#171717">Answer: 190 + 95 + 40 = 325</text>
  </g>
</svg>
