<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@900&family=JetBrains+Mono:wght@600;700;800&family=EB+Garamond:ital,wght@0,600;1,500;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: #FFFFFF;
      color: #0B0B0B;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      position: relative;
    }

    .yellow-top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
      background: #FFD21C;
    }

    .bg-math-grid {
      position: absolute;
      inset: 0;
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, #E2E8F0 0.85px, transparent 0.85px),
        linear-gradient(to bottom, #E2E8F0 0.85px, transparent 0.85px);
    }

    /* TOP-LEFT EXPECTATION FORMULA */
    .top-left-stat-box {
      position: absolute;
      top: 32px;
      left: 50px;
      width: 290px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #CBD5E1;
      border-left: 3.5px solid #FFD21C;
      padding: 10px 14px;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
      z-index: 15;
    }
    .stat-header {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      color: #64748B;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-dot {
      width: 5px;
      height: 5px;
      background: #FFD21C;
      border-radius: 50%;
    }
    .exp-math {
      font-family: 'EB Garamond', serif;
      font-size: 20px;
      font-style: italic;
      color: #0B0B0B;
      line-height: 1.25;
    }
    .stat-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      color: #64748B;
      margin-top: 4px;
      font-style: normal;
    }

    .content-box {
      position: relative;
      z-index: 10;
      margin-left: 360px;
      margin-right: 60px;
      width: calc(100% - 420px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 14px;
    }

    .hero-title {
      font-size: 68px;
      font-weight: 900;
      letter-spacing: -3.2px;
      line-height: 1;
      color: #0B0B0B;
      text-transform: uppercase;
      margin-bottom: 12px;
      white-space: nowrap;
    }

    .venn-svg-box {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .mail-footer {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #64748B;
      font-weight: 600;
    }
    .mail-footer strong { color: #0B0B0B; }
    .dot-yellow {
      width: 7px;
      height: 7px;
      background: #FFD21C;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="yellow-top-bar"></div>
  <div class="bg-math-grid"></div>

  <!-- Top-Left Expectation Formula -->
  <div class="top-left-stat-box">
    <div class="stat-header">
      <span class="stat-dot"></span>
      <span>EXPECTED VALUE // DECISION THEORY</span>
    </div>
    <div class="exp-math">
      𝔼[Y | X] = ∫ y · f(y | X) dy
    </div>
    <div class="stat-sub">
      Optimal Strategy Formulation
    </div>
  </div>

  <div class="content-box">
    <h1 class="hero-title">DATA MINDED &amp; MANAGEMENT.</h1>

    <div class="venn-svg-box">
      <svg width="600" height="175" viewBox="0 0 600 175" fill="none">
        <defs>
          <clipPath id="f4Clip"><circle cx="230" cy="88" r="85"/></clipPath>
        </defs>

        <circle cx="230" cy="88" r="85" stroke="#0B0B0B" stroke-width="2.5" fill="#FFFFFF" fill-opacity="0.9"/>
        <circle cx="370" cy="88" r="85" stroke="#0B0B0B" stroke-width="2.5" fill="#FFFFFF" fill-opacity="0.9"/>

        <circle cx="370" cy="88" r="85" fill="#FFD21C" clip-path="url(#f4Clip)"/>

        <circle cx="230" cy="88" r="85" stroke="#0B0B0B" stroke-width="2.5" fill="none"/>
        <circle cx="370" cy="88" r="85" stroke="#0B0B0B" stroke-width="2.5" fill="none"/>

        <line x1="40" y1="162" x2="560" y2="162" stroke="#CBD5E1" stroke-width="1.5"/>

        <text x="165" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="900" fill="#0B0B0B" text-anchor="middle">DATA</text>
        <text x="165" y="104" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">MINDSET</text>

        <text x="435" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="900" fill="#0B0B0B" text-anchor="middle">MANAGEMENT</text>
        <text x="435" y="104" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">EXECUTION</text>

        <circle cx="300" cy="78" r="4.5" fill="#0B0B0B"/>
        <text x="300" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#0B0B0B" text-anchor="middle">SWEET SPOT</text>
      </svg>
    </div>

    <div class="mail-footer">
      <span class="dot-yellow"></span>
      <span><strong>kritisharma1481550@gmail.com</strong></span>
    </div>
  </div>
</body>
</html>
