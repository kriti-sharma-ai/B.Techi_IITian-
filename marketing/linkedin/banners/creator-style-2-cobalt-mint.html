<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: #1D4ED8;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      position: relative;
    }

    .left-pixel-matrix {
      position: absolute;
      top: 0;
      left: 0;
      width: 320px;
      height: 396px;
      display: grid;
      grid-template-columns: repeat(3, 85px);
      grid-template-rows: repeat(4, 85px);
      gap: 15px;
      padding: 20px 25px;
      pointer-events: none;
    }
    .px-box {
      width: 85px;
      height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .px-lime {
      background: #00F59B;
      border-radius: 4px;
    }
    .px-white {
      background: #FFFFFF;
      border-radius: 4px;
    }
    .px-inner-white {
      width: 36px;
      height: 36px;
      background: #FFFFFF;
      border-radius: 2px;
    }

    .right-photo-wave {
      position: absolute;
      top: 0;
      right: 0;
      width: 440px;
      height: 396px;
      z-index: 5;
    }
    .wave-mask {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      clip-path: path("M 80 0 C 10 90, -20 220, 60 320 C 90 360, 110 380, 130 396 L 440 396 L 440 0 Z");
      overflow: hidden;
      background: #E2E8F0;
    }
    .portrait-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      transform: scale(1.05);
    }

    .mini-pixel-corner {
      position: absolute;
      bottom: 18px;
      right: 18px;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(3, 14px);
      grid-template-rows: repeat(3, 14px);
      gap: 4px;
      background: #0B1938;
      padding: 6px;
      border-radius: 4px;
    }
    .c-sq { width: 14px; height: 14px; border-radius: 1px; }
    .c-lime { background: #00F59B; }
    .c-white { background: #FFFFFF; }
    .c-black { background: #0B1938; }

    .center-content {
      position: relative;
      z-index: 10;
      margin-left: 360px;
      width: 760px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-top: 10px;
    }

    .name-line {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }
    .hero-name {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -1.5px;
      line-height: 1;
      color: #FFFFFF;
    }

    .role-badge-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }
    .badge-pill-lime {
      background: #00F59B;
      color: #064E3B;
      font-size: 24px;
      font-weight: 800;
      padding: 3px 14px;
      border-radius: 4px;
      line-height: 1.1;
      letter-spacing: -0.5px;
    }
    .role-text-white {
      font-size: 28px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.5px;
    }

    .skills-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }
    .bounding-box {
      border: 1.5px dashed rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.08);
      padding: 7px 18px;
      font-size: 15px;
      font-weight: 700;
      color: #FFFFFF;
      border-radius: 4px;
      position: relative;
    }
    .bounding-box::before, .bounding-box::after {
      content: '';
      position: absolute;
      width: 5px;
      height: 5px;
      background: #FFFFFF;
    }
    .bounding-box::before { top: -3px; left: -3px; }
    .bounding-box::after { bottom: -3px; right: -3px; }

    .contact-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      font-weight: 600;
      color: #FFFFFF;
      opacity: 0.95;
    }
    .c-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="left-pixel-matrix">
    <div class="px-box px-lime"><div class="px-inner-white"></div></div>
    <div class="px-box px-lime"></div>
    <div class="px-box"></div>

    <div class="px-box px-white"></div>
    <div class="px-box px-white"></div>
    <div class="px-box px-lime"><div class="px-inner-white"></div></div>

    <div class="px-box px-lime"></div>
    <div class="px-box px-lime"></div>
    <div class="px-box"></div>

    <div class="px-box"></div>
    <div class="px-box px-lime"></div>
    <div class="px-box px-white"></div>
  </div>

  <div class="center-content">
    <div class="name-line">
      <h1 class="hero-name">Masuddar Rahaman</h1>
      
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <rect x="0" y="0" width="6" height="6" fill="#00F59B" />
      <rect x="9" y="0" width="6" height="6" fill="#FFFFFF" />
      <rect x="18" y="0" width="6" height="6" fill="#00F59B" />
      <rect x="0" y="9" width="6" height="6" fill="#FFFFFF" />
      <rect x="9" y="9" width="6" height="6" fill="#00F59B" />
      <rect x="18" y="9" width="6" height="6" fill="#FFFFFF" />
      <rect x="0" y="18" width="6" height="6" fill="#00F59B" />
      <rect x="9" y="18" width="6" height="6" fill="#FFFFFF" />
      <rect x="18" y="18" width="6" height="6" fill="#00F59B" />
    </svg>
  
    </div>

    <div class="role-badge-row">
      <span class="badge-pill-lime">Founder</span>
      <span class="role-text-white">Data Scientist</span>
    </div>

    <div class="skills-row">
      <div class="bounding-box">Statistical ML</div>
      <div class="bounding-box">Pipelines &amp; MLOps</div>
      <div class="bounding-box">KaizenStat</div>
    </div>

    <div class="contact-row">
      <div class="c-item">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
        <span>github.com/masuddar-rahaman</span>
      </div>
      <div class="c-item">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        <span>masuddarrahaman31@gmail.com</span>
      </div>
    </div>
  </div>

  <div class="right-photo-wave">
    <div class="wave-mask">
      <img src="/Users/masuddarrahaman/Downloads/Btechi-web/marketing/linkedin/banners/masuddar-portrait.png" class="portrait-image" />
    </div>

    <div class="mini-pixel-corner">
      <div class="c-sq c-lime"></div>
      <div class="c-sq c-white"></div>
      <div class="c-sq c-lime"></div>
      <div class="c-sq c-white"></div>
      <div class="c-sq c-black"></div>
      <div class="c-sq c-white"></div>
      <div class="c-sq c-lime"></div>
      <div class="c-sq c-white"></div>
      <div class="c-sq c-lime"></div>
    </div>
  </div>
</body>
</html>
