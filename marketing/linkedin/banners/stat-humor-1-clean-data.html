<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: #FFFFFF;
      color: #0F172A;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      position: relative;
      display: flex;
      align-items: center;
    }

    /* Very subtle architectural hairline grid */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, #F8FAFC 1px, transparent 1px),
        linear-gradient(to bottom, #F8FAFC 1px, transparent 1px);
    }

    .banner-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      margin-left: 360px;
      margin-right: 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 55px 0 45px;
    }

    .main-block {
      display: flex;
      flex-direction: column;
    }

    .main-title {
      font-size: 76px;
      font-weight: 900;
      letter-spacing: -3.5px;
      line-height: 0.95;
      color: #0F172A;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    /* The Statistical Humor Equation */
    .equation-box {
      display: flex;
      align-items: baseline;
      gap: 16px;
      font-family: 'JetBrains Mono', monospace;
    }
    .math-formula {
      font-size: 20px;
      font-weight: 600;
      color: #0F172A;
      letter-spacing: -0.5px;
    }
    .math-condition {
      font-size: 14px;
      color: #64748B;
      font-weight: 500;
    }
    .math-condition strong {
      color: #2563EB;
      font-weight: 600;
    }

    /* Bottom Mail line */
    .bottom-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      color: #64748B;
      letter-spacing: 0.5px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10B981;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="banner-wrap">
    <div class="main-block">
      <h1 class="main-title">DATA SCIENTIST</h1>
      
      <div class="equation-box">
        <span class="math-formula">y = f(X) + ε</span>
        <span class="math-condition">where ε ~ 𝒩(0, σ²) &amp; <strong>P(clean_data) = 0</strong></span>
      </div>
    </div>

    <div class="bottom-row">
      <span class="dot"></span>
      <span>masuddarrahaman31@gmail.com</span>
    </div>
  </div>
</body>
</html>
