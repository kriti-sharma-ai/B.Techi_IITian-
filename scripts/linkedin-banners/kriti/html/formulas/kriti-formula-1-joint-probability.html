<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&family=JetBrains+Mono:ital,wght@0,600;0,700;1,500;1,600&family=EB+Garamond:ital,wght@0,600;1,500;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: #FFFFFF;
      color: #0B0B0B;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      position: relative;
    }

    .yellow-top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
      background: #FFD21C;
      z-index: 20;
    }

    .bg-math-grid {
      position: absolute;
      inset: 0;
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, #E2E8F0 0.85px, transparent 0.85px),
        linear-gradient(to bottom, #E2E8F0 0.85px, transparent 0.85px);
    }

    /* STAT FORMULA IN TOP-LEFT (Fills empty space above avatar) */
    .top-left-stat-box {
      position: absolute;
      top: 34px;
      left: 50px;
      width: 290px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #CBD5E1;
      border-left: 3.5px solid #FFD21C;
      padding: 10px 14px;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
      z-index: 15;
    }
    .stat-header {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      color: #64748B;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-dot {
      width: 5px;
      height: 5px;
      background: #FFD21C;
      border-radius: 50%;
    }
    .formula-math {
      font-family: 'EB Garamond', serif;
      font-size: 20px;
      font-style: italic;
      color: #0B0B0B;
      line-height: 1.25;
      letter-spacing: 0.2px;
    }
    .formula-math span.op {
      font-style: normal;
      font-family: -apple-system, sans-serif;
      padding: 0 3px;
    }
    .stat-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #64748B;
      margin-top: 4px;
      font-style: normal;
    }

    .main-wrap {
      position: relative;
      z-index: 10;
      height: 100%;
      margin-left: 380px;
      margin-right: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 30px 0;
    }

    .text-column {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 640px;
    }

    .kicker-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 800;
      color: #0B0B0B;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .kicker-tag::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #FFD21C;
      border: 1.5px solid #0B0B0B;
      border-radius: 2px;
    }

    .big-title {
      font-size: 74px;
      font-weight: 900;
      letter-spacing: -3.2px;
      line-height: 0.95;
      color: #0B0B0B;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
    }
    .line-1 { white-space: nowrap; }
    .line-2 { white-space: nowrap; margin-top: 4px; }

    .mail-row {
      margin-top: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      color: #64748B;
      font-weight: 600;
    }
    .mail-row strong { color: #0B0B0B; }
    .dot-yellow {
      width: 8px;
      height: 8px;
      background: #FFD21C;
      border-radius: 50%;
    }

    .venn-container {
      width: 480px;
      height: 290px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="yellow-top-bar"></div>
  <div class="bg-math-grid"></div>

  <!-- Top-Left Stat Formula Box -->
  <div class="top-left-stat-box">
    <div class="stat-header">
      <span class="stat-dot"></span>
      <span>JOINT PROBABILITY // SET THEORY</span>
    </div>
    <div class="formula-math">
      P(A ∩ B) <span class="op">=</span> P(A) <span class="op">·</span> P(B | A)
    </div>
    <div class="stat-sub">
      where A = Data, B = Management
    </div>
  </div>

  <div class="main-wrap">
    <div class="text-column">
      <div class="kicker-tag">CORE COMPETENCY // STRATEGY</div>
      <h1 class="big-title">
        <span class="line-1">DATA MINDED</span>
        <span class="line-2">&amp; MANAGEMENT.</span>
      </h1>
      <div class="mail-row">
        <span class="dot-yellow"></span>
        <span><strong>kritisharma1481550@gmail.com</strong></span>
      </div>
    </div>

    <!-- Venn Diagram Column -->
    <div class="venn-container">
      <svg width="480" height="280" viewBox="0 0 480 280" fill="none">
        <defs>
          <clipPath id="f1Clip">
            <circle cx="165" cy="140" r="110"/>
          </clipPath>
        </defs>

        <!-- Circle 1: Data Minded (Left) -->
        <circle cx="165" cy="140" r="110" stroke="#0B0B0B" stroke-width="2.5" fill="#FFFFFF" fill-opacity="0.85"/>
        
        <!-- Circle 2: Management (Right) -->
        <circle cx="315" cy="140" r="110" stroke="#0B0B0B" stroke-width="2.5" fill="#FFFFFF" fill-opacity="0.85"/>

        <!-- Intersection (Filled with BTechi Signature Yellow) -->
        <circle cx="315" cy="140" r="110" fill="#FFD21C" clip-path="url(#f1Clip)"/>
        
        <!-- Re-stroke boundaries -->
        <circle cx="165" cy="140" r="110" stroke="#0B0B0B" stroke-width="2.5" fill="none"/>
        <circle cx="315" cy="140" r="110" stroke="#0B0B0B" stroke-width="2.5" fill="none"/>

        <!-- Labels Inside Left Circle -->
        <text x="105" y="136" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#0B0B0B" text-anchor="middle" letter-spacing="-0.5">DATA</text>
        <text x="105" y="156" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="middle">MINDED (A)</text>

        <!-- Labels Inside Right Circle -->
        <text x="375" y="136" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="900" fill="#0B0B0B" text-anchor="middle" letter-spacing="-0.5">MANAGEMENT</text>
        <text x="375" y="156" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="middle">EXECUTION (B)</text>

        <!-- Center Intersection Badge -->
        <circle cx="240" cy="130" r="5" fill="#0B0B0B"/>
        <text x="240" y="154" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#0B0B0B" text-anchor="middle" letter-spacing="-0.3">A ∩ B (IMPACT)</text>
      </svg>
    </div>
  </div>
</body>
</html>
