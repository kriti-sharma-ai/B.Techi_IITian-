<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: #FFFFFF;
      color: #111827;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      position: relative;
      display: flex;
      align-items: center;
    }

    .outer-frame {
      position: absolute;
      top: 24px;
      bottom: 24px;
      left: 360px;
      right: 50px;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      padding: 30px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FAFAFA;
    }

    .text-side {
      flex: 1;
    }

    .tag-mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 600;
      color: #6B7280;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .big-name {
      font-size: 68px;
      font-weight: 900;
      letter-spacing: -3px;
      line-height: 0.95;
      color: #111827;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .caption-line {
      font-size: 15px;
      font-weight: 600;
      color: #4B5563;
      letter-spacing: -0.2px;
    }
    .caption-line strong {
      color: #111827;
    }

    /* Monochromatic Square Matrix */
    .mono-grid {
      display: flex;
      gap: 12px;
    }

    .sq-card {
      width: 104px;
      height: 104px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s;
    }

    .card-solid-black {
      background: #111827;
      color: #FFFFFF;
    }
    .card-solid-black .c-num {
      font-size: 10px;
      color: #9CA3AF;
    }
    .card-solid-black .c-text {
      font-size: 12px;
      font-weight: 600;
    }

    .card-outline {
      border: 1px solid #D1D5DB;
      background: #FFFFFF;
      color: #111827;
    }
    .card-outline .c-num {
      font-size: 10px;
      color: #6B7280;
    }
    .card-outline .c-text {
      font-size: 12px;
      font-weight: 600;
    }

    .card-gray {
      background: #E5E7EB;
      color: #1F2937;
    }
    .card-gray .c-num {
      font-size: 10px;
      color: #6B7280;
    }
    .card-gray .c-text {
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="outer-frame">
    <div class="text-side">
      <div class="tag-mono">MASUDDAR RAHAMAN // RESEARCH</div>
      <h1 class="big-name">DATA SCIENTIST</h1>
      <div class="caption-line">
        <strong>Founder @ KaizenStat</strong> • SWE Intern @ Algoritmo Lab • SIT '27
      </div>
    </div>

    <!-- 3 Elegant Monochromatic Square Cards -->
    <div class="mono-grid">
      <div class="sq-card card-solid-black">
        <span class="c-num">01 / ML</span>
        <span class="c-text">Kaizen<br>Stat</span>
      </div>

      <div class="sq-card card-outline">
        <span class="c-num">02 / MODEL</span>
        <div style="display:flex; justify-content:space-between; align-items:flex-end;">
          <span class="c-text">Stats</span>
          <svg width="28" height="16" viewBox="0 0 100 50" fill="none" stroke="#111827" stroke-width="2.5">
            <path d="M 0 48 Q 30 48 40 30 Q 50 2 60 30 Q 70 48 100 48"/>
          </svg>
        </div>
      </div>

      <div class="sq-card card-gray">
        <span class="c-num">03 / STACK</span>
        <span class="c-text">Python<br>MLOps</span>
      </div>
    </div>
  </div>
</body>
</html>
