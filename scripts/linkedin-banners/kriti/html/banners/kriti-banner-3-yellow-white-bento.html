<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: #FAFAFA;
      color: #0B0B0B;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      position: relative;
    }

    .bg-math-grid {
      position: absolute;
      inset: 0;
      background-size: 28px 28px;
      background-image: 
        linear-gradient(to right, #EEF2F6 1px, transparent 1px),
        linear-gradient(to bottom, #EEF2F6 1px, transparent 1px);
    }

    .main-bento {
      position: relative;
      z-index: 10;
      height: 100%;
      margin-left: 360px;
      margin-right: 80px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 30px 0;
    }

    /* Left Hero Card */
    .bento-hero {
      flex: 1.85;
      height: 100%;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .tag-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      color: #0B0B0B;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tag-meta::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #FFD21C;
      border-radius: 2px;
    }

    .name-title {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
      color: #0B0B0B;
      margin: 8px 0 6px;
    }

    .tagline-sub {
      font-size: 16.5px;
      font-weight: 700;
      color: #475569;
    }
    .tagline-sub strong {
      color: #0B0B0B;
    }

    .mail-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #64748B;
      padding-top: 10px;
      border-top: 1px solid #F1F5F9;
    }
    .mail-line strong {
      color: #0B0B0B;
    }
    .mail-line svg {
      color: #FFD21C;
    }

    /* Right 3 Bento Spec Cards */
    .bento-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 330px;
      height: 100%;
    }

    .bento-card {
      flex: 1;
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #E2E8F0;
    }

    .card-yellow {
      background: #FFD21C;
      border-color: #E6BC0E;
      color: #0B0B0B;
      box-shadow: 0 4px 12px rgba(255, 210, 28, 0.25);
    }
    .card-yellow .c-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 800;
      color: #0B0B0B;
      letter-spacing: 1px;
    }
    .card-yellow .c-heading {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -0.4px;
    }

    .card-white {
      background: #FFFFFF;
      color: #0B0B0B;
    }
    .card-white .c-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      color: #94A3B8;
      letter-spacing: 1px;
    }
    .card-white .c-heading {
      font-size: 18px;
      font-weight: 800;
      color: #1E293B;
      letter-spacing: -0.4px;
    }
  </style>
</head>
<body>
  <div class="bg-math-grid"></div>

  <div class="main-bento">
    <!-- Hero Box -->
    <div class="bento-hero">
      <div>
        <div class="tag-meta">LEADERSHIP // STRATEGY &amp; DATA</div>
        <h1 class="name-title">KRITI SHARMA</h1>
        <div class="tagline-sub">
          <strong>Future-focused</strong> leadership with a data-driven management mindset.
        </div>
      </div>

      <div class="mail-line">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        <span><strong>kritisharma1481550@gmail.com</strong></span>
      </div>
    </div>

    <!-- 3 Stacked Bento Feature Cards -->
    <div class="bento-column">
      <div class="bento-card card-yellow">
        <span class="c-num">01 / VISION</span>
        <span class="c-heading">Future-focused</span>
      </div>

      <div class="bento-card card-white">
        <span class="c-num">02 / APPROACH</span>
        <span class="c-heading">Data-driven</span>
      </div>

      <div class="bento-card card-white">
        <span class="c-num">03 / EXECUTION</span>
        <span class="c-heading">Management mindset</span>
      </div>
    </div>
  </div>
</body>
</html>
