<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: #FAFAFA;
      color: #0F172A;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      position: relative;
      display: flex;
      align-items: center;
    }

    .main-wrap {
      width: 100%;
      margin-left: 360px;
      margin-right: 50px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Main Big Hero Bento Card */
    .hero-card {
      flex: 1.8;
      height: 270px;
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      padding: 26px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .author-line {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      color: #64748B;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .author-line .badge-active {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #10B981;
      font-size: 11px;
    }

    .big-title {
      font-size: 76px;
      font-weight: 900;
      letter-spacing: -3.5px;
      line-height: 0.95;
      color: #0F172A;
      text-transform: uppercase;
      margin: 8px 0;
    }

    .hero-footer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: #2563EB;
      letter-spacing: 0.5px;
    }

    /* Right Color Square Tiles (Bento Columns) */
    .color-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tile-square {
      width: 129px;
      height: 129px;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Solid color tiles */
    .tile-cobalt {
      background: #2563EB;
      color: #FFFFFF;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    }
    .tile-cobalt .title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .tile-cobalt .code {
      font-size: 11px;
      opacity: 0.85;
    }

    .tile-amber {
      background: #F59E0B;
      color: #FFFFFF;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.25);
    }
    .tile-amber .title {
      font-size: 14px;
      font-weight: 700;
    }
    .tile-amber .code {
      font-size: 11px;
      opacity: 0.9;
    }

    .tile-emerald {
      background: #10B981;
      color: #FFFFFF;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);
    }
    .tile-emerald .title {
      font-size: 14px;
      font-weight: 700;
    }
    .tile-emerald .code {
      font-size: 11px;
      opacity: 0.9;
    }

    .tile-wireframe {
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      color: #334155;
    }
    .tile-wireframe .title {
      font-size: 13px;
      font-weight: 700;
      color: #0F172A;
    }
    .tile-wireframe .code {
      font-size: 11px;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="main-wrap">
    <!-- Big Center-Left Box with Giant Typography -->
    <div class="hero-card">
      <div class="author-line">
        <span>MASUDDAR RAHAMAN</span>
        <span class="badge-active">● KAIZENSTAT CORE</span>
      </div>

      <div class="big-title">
        DATA<br>SCIENTIST
      </div>

      <div class="hero-footer">
        STATISTICAL MODELING • REPRODUCIBLE ML • PYTHON
      </div>
    </div>

    <!-- Square Color Column 1 -->
    <div class="color-column">
      <div class="tile-square tile-cobalt">
        <span class="code">01 // ML</span>
        <span class="title">Kaizen<br>Stat</span>
      </div>
      <div class="tile-square tile-wireframe">
        <span class="code">02 // STATS</span>
        <div>
          <svg width="40" height="20" viewBox="0 0 100 50" fill="none" stroke="#2563EB" stroke-width="3">
            <path d="M 0 48 Q 30 48 40 30 Q 50 2 60 30 Q 70 48 100 48"/>
          </svg>
          <div class="title" style="margin-top:2px;">Gaussian</div>
        </div>
      </div>
    </div>

    <!-- Square Color Column 2 -->
    <div class="color-column">
      <div class="tile-square tile-amber">
        <span class="code">03 // CODE</span>
        <span class="title">Python<br>&amp; PyTorch</span>
      </div>
      <div class="tile-square tile-emerald">
        <span class="code">04 // OPEN</span>
        <span class="title">GSSoC<br>'25</span>
      </div>
    </div>
  </div>
</body>
</html>
