<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: #FAFAFA;
      color: #111827;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      position: relative;
      display: flex;
      align-items: center;
    }

    .banner-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      margin-left: 360px;
      margin-right: 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 55px 0 45px;
    }

    .main-block {
      display: flex;
      flex-direction: column;
    }

    .main-title {
      font-size: 76px;
      font-weight: 900;
      letter-spacing: -3.5px;
      line-height: 0.95;
      color: #111827;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .equation-box {
      display: flex;
      align-items: baseline;
      gap: 16px;
      font-family: 'JetBrains Mono', monospace;
    }
    .math-formula {
      font-size: 20px;
      font-weight: 700;
      color: #111827;
    }
    .math-condition {
      font-size: 14px;
      color: #6B7280;
    }
    .math-condition strong {
      color: #EF4444;
      font-weight: 600;
    }

    .bottom-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      color: #6B7280;
    }
    .square-indicator {
      width: 6px;
      height: 6px;
      background: #111827;
    }
  </style>
</head>
<body>
  <div class="banner-wrap">
    <div class="main-block">
      <h1 class="main-title">DATA SCIENTIST</h1>
      
      <div class="equation-box">
        <span class="math-formula">R² = 0.999</span>
        <span class="math-condition">// statistically significant, <strong>practically suspicious</strong></span>
      </div>
    </div>

    <div class="bottom-row">
      <span class="square-indicator"></span>
      <span>masuddarrahaman31@gmail.com</span>
    </div>
  </div>
</body>
</html>
