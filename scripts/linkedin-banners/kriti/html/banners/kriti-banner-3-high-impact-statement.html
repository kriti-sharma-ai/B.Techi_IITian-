<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: #FFFFFF;
      color: #0B0B0B;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      position: relative;
      display: flex;
      align-items: center;
    }

    .bg-math-grid {
      position: absolute;
      inset: 0;
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, #F1F5F9 1px, transparent 1px),
        linear-gradient(to bottom, #F1F5F9 1px, transparent 1px);
    }

    .accent-bar-left {
      position: absolute;
      top: 0;
      left: 0;
      width: 8px;
      height: 100%;
      background: #FFD21C;
    }

    .main-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      margin-left: 360px;
      margin-right: 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 0 32px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .author-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: #64748B;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .author-name strong {
      color: #0B0B0B;
    }

    /* Giant 3-Line Statement */
    .big-statement {
      font-size: 56px;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1.05;
      color: #0B0B0B;
      margin: 10px 0;
    }
    .highlight-yellow {
      background: #FFD21C;
      padding: 0 10px;
      display: inline-block;
      line-height: 1.08;
    }

    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 14px;
      border-top: 1.5px solid #0B0B0B;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }
    .mail-tag {
      color: #0B0B0B;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mail-tag .dot {
      width: 8px;
      height: 8px;
      background: #FFD21C;
      border: 1.5px solid #0B0B0B;
    }
    .tag-right {
      color: #64748B;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="accent-bar-left"></div>
  <div class="bg-math-grid"></div>

  <div class="main-wrap">
    <div class="header-row">
      <div class="author-name"><strong>KRITI SHARMA</strong> // PORTFOLIO</div>
      <div style="font-family:'JetBrains Mono',monospace; font-size:12px; color:#64748B; font-weight:600;">
        PRODUCT • DATA • MANAGEMENT
      </div>
    </div>

    <div class="big-statement">
      <div>Future-focused. Data-driven.</div>
      <div><span class="highlight-yellow">Management mindset.</span></div>
    </div>

    <div class="bottom-row">
      <div class="mail-tag">
        <span class="dot"></span>
        <span>kritisharma1481550@gmail.com</span>
      </div>
      <div class="tag-right">
        STRATEGY × EXECUTION
      </div>
    </div>
  </div>
</body>
</html>
