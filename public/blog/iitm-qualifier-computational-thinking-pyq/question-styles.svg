<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, sans-serif">
  <rect class="bg" width="800" height="420" fill="#fff"/>
  <text class="t" x="40" y="40" font-size="20" font-weight="700" fill="#171717">What CT qualifier questions ask you to do</text>
  <text class="tm" x="40" y="63" font-size="14" fill="#667085">All 54 questions from 4 qualifier papers (May 2023 to May 2024), sorted by task. Counted by hand.</text>
  <!-- scale: 20px per question, bars start at x=300 -->
  <g font-size="14">
    <text class="t" x="40" y="108" fill="#171717" font-weight="600">Explain the code</text>
    <text class="tm" x="40" y="126" font-size="12" fill="#667085">"What will A represent?"</text>
    <rect class="purple" x="300" y="94" width="380" height="30" rx="6" fill="#7c3aed"/>
    <text class="t" x="690" y="115" fill="#171717" font-weight="700">19</text>

    <text class="t" x="40" y="158" fill="#171717" font-weight="600">Complete the code</text>
    <text class="tm" x="40" y="176" font-size="12" fill="#667085">"Choose the correct code fragment"</text>
    <rect class="purple" x="300" y="144" width="360" height="30" rx="6" fill="#7c3aed"/>
    <text class="t" x="670" y="165" fill="#171717" font-weight="700">18</text>

    <text class="t" x="40" y="208" fill="#171717" font-weight="600">Trace to a value</text>
    <text class="tm" x="40" y="226" font-size="12" fill="#667085">"What is the value of count?"</text>
    <rect class="blue" x="300" y="194" width="200" height="30" rx="6" fill="#2563eb"/>
    <text class="t" x="510" y="215" fill="#171717" font-weight="700">10</text>

    <text class="t" x="40" y="258" fill="#171717" font-weight="600">Find the mistakes</text>
    <text class="tm" x="40" y="276" font-size="12" fill="#667085">"Identify all lines with errors"</text>
    <rect class="blue" x="300" y="244" width="80" height="30" rx="6" fill="#2563eb"/>
    <text class="t" x="390" y="265" fill="#171717" font-weight="700">4</text>

    <text class="t" x="40" y="308" fill="#171717" font-weight="600">Data sanity</text>
    <text class="tm" x="40" y="326" font-size="12" fill="#667085">"Which rows have wrong values?"</text>
    <rect class="teal" x="300" y="294" width="40" height="30" rx="6" fill="#0d9488"/>
    <text class="t" x="350" y="315" fill="#171717" font-weight="700">2</text>

    <text class="t" x="40" y="358" fill="#171717" font-weight="600">Expression basics</text>
    <text class="tm" x="40" y="376" font-size="12" fill="#667085">"True, False or invalid?"</text>
    <rect class="teal" x="300" y="344" width="20" height="30" rx="6" fill="#0d9488"/>
    <text class="t" x="330" y="365" fill="#171717" font-weight="700">1</text>
  </g>
  <text class="tm" x="40" y="406" font-size="11" fill="#667085">Source: official CT qualifier papers and answer keys on BTechi (May 2023, Sep 2023, Jan 2024, May 2024).</text>
</svg>
