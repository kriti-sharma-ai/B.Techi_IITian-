<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: #FFFFFF;
      color: #0B0B0B;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      position: relative;
    }

    /* Math square grid (Exact BTechi pattern) */
    .bg-math-grid {
      position: absolute;
      inset: 0;
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, #E2E8F0 0.85px, transparent 0.85px),
        linear-gradient(to bottom, #E2E8F0 0.85px, transparent 0.85px);
    }

    /* Edge-to-edge BTechi signature yellow line */
    .yellow-bar {
      position: absolute;
      left: 0;
      right: 0;
      top: 155px;
      height: 10px;
      background: #FFD21C;
    }

    /* Top Section (Above Yellow Line, x = 650px) */
    .top-section {
      position: absolute;
      left: 640px;
      top: 60px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-mark {
      width: 52px;
      height: 52px;
      background: #FFD21C;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: #0B0B0B;
      letter-spacing: -0.5px;
      box-shadow: 0 2px 8px rgba(255, 210, 28, 0.35);
    }
    .name-title {
      font-size: 46px;
      font-weight: 900;
      letter-spacing: -1.8px;
      color: #0B0B0B;
      line-height: 1;
    }
    .badge-sub {
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      color: #475569;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      margin-left: 6px;
    }

    /* Bottom Section (Below Yellow Line, x = 640px) */
    .bottom-section {
      position: absolute;
      left: 640px;
      top: 195px;
      right: 120px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .tagline {
      font-size: 31px;
      font-weight: 700;
      color: #1E293B;
      letter-spacing: -0.7px;
      line-height: 1.25;
    }
    .tagline strong {
      color: #0B0B0B;
      font-weight: 800;
    }

    .footer-line {
      display: flex;
      align-items: center;
      gap: 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14.5px;
      color: #475569;
    }
    .email-chip {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #0B0B0B;
      font-weight: 600;
    }
    .yellow-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #FFD21C;
      display: inline-block;
    }
    .chip-tags {
      display: flex;
      gap: 10px;
    }
    .chip {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 12px;
      color: #64748B;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="bg-math-grid"></div>
  <div class="yellow-bar"></div>

  <!-- Top: Logo + Name -->
  <div class="top-section">
    <div class="brand-mark">KS</div>
    <div class="name-title">KRITI SHARMA</div>
    <span class="badge-sub">LEADERSHIP &amp; DATA</span>
  </div>

  <!-- Bottom: Signature Statement & Contact -->
  <div class="bottom-section">
    <div class="tagline">
      <strong>Future-focused. Data-driven.</strong> Management mindset.
    </div>
    <div class="footer-line">
      <div class="email-chip">
        <span class="yellow-dot"></span>
        <span>kritisharma1481550@gmail.com</span>
      </div>
      <div class="chip-tags">
        <span class="chip">Strategy</span>
        <span class="chip">Data Decisioning</span>
        <span class="chip">Execution</span>
      </div>
    </div>
  </div>
</body>
</html>
