<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, sans-serif">
  <rect class="bg" width="800" height="480" fill="#fff"/>
  <text class="t" x="40" y="40" font-size="20" font-weight="700" fill="#171717">English I qualifier questions by topic</text>
  <text class="tm" x="40" y="63" font-size="14" fill="#667085">150 questions from the May 2023, Sep 2023, Jan 2024 and May 2024 qualifier papers.</text>
  <g font-size="13">
    <text class="t" x="320" y="107" fill="#171717" text-anchor="end">Reading comprehension</text>
    <rect class="purple" x="332" y="93" width="360" height="20" rx="5" fill="#7c3aed"/>
    <text class="t" x="700" y="108" fill="#171717" font-weight="700">30</text>
    <text class="t" x="320" y="137" fill="#171717" text-anchor="end">Vocabulary, synonyms &amp; collocations</text>
    <rect class="purple" x="332" y="123" width="288" height="20" rx="5" fill="#7c3aed"/>
    <text class="t" x="628" y="138" fill="#171717" font-weight="700">24</text>
    <text class="t" x="320" y="167" fill="#171717" text-anchor="end">Telephone conversations</text>
    <rect class="purple" x="332" y="153" width="252" height="20" rx="5" fill="#7c3aed"/>
    <text class="t" x="592" y="168" fill="#171717" font-weight="700">21</text>
    <text class="t" x="320" y="197" fill="#171717" text-anchor="end">Vowels, diphthongs &amp; semi-vowels</text>
    <rect class="blue" x="332" y="183" width="228" height="20" rx="5" fill="#2563eb"/>
    <text class="t" x="568" y="198" fill="#171717" font-weight="700">19</text>
    <text class="t" x="320" y="227" fill="#171717" text-anchor="end">Prepositions, conjunctions &amp; articles</text>
    <rect class="blue" x="332" y="213" width="204" height="20" rx="5" fill="#2563eb"/>
    <text class="t" x="544" y="228" fill="#171717" font-weight="700">17</text>
    <text class="t" x="320" y="257" fill="#171717" text-anchor="end">Nouns, pronouns &amp; parts of speech</text>
    <rect class="blue" x="332" y="243" width="156" height="20" rx="5" fill="#2563eb"/>
    <text class="t" x="496" y="258" fill="#171717" font-weight="700">13</text>
    <text class="t" x="320" y="287" fill="#171717" text-anchor="end">Phrasal verbs &amp; idioms</text>
    <rect class="blue" x="332" y="273" width="156" height="20" rx="5" fill="#2563eb"/>
    <text class="t" x="496" y="288" fill="#171717" font-weight="700">13</text>
    <text class="t" x="320" y="317" fill="#171717" text-anchor="end">Verbs, tenses &amp; modals</text>
    <rect class="teal" x="332" y="303" width="72" height="20" rx="5" fill="#0d9488"/>
    <text class="t" x="412" y="318" fill="#171717" font-weight="700">6</text>
    <text class="t" x="320" y="347" fill="#171717" text-anchor="end">Adjectives &amp; adverbs</text>
    <rect class="teal" x="332" y="333" width="60" height="20" rx="5" fill="#0d9488"/>
    <text class="t" x="400" y="348" fill="#171717" font-weight="700">5</text>
    <text class="t" x="320" y="377" fill="#171717" text-anchor="end">Subject-verb agreement</text>
    <rect class="teal" x="332" y="363" width="12" height="20" rx="5" fill="#0d9488"/>
    <text class="t" x="352" y="378" fill="#171717" font-weight="700">1</text>
    <text class="t" x="320" y="407" fill="#171717" text-anchor="end">Consonants, syllables &amp; stress</text>
    <rect class="teal" x="332" y="393" width="12" height="20" rx="5" fill="#0d9488"/>
    <text class="t" x="352" y="408" fill="#171717" font-weight="700">1</text>
  </g>
  <text class="tm" x="40" y="442" font-size="11" fill="#667085">Source: BTechi topic tags of the official papers. Listening (audio) questions are not included.</text>
</svg>
