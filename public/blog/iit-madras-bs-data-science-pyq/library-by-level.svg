<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="system-ui, sans-serif">
  <rect class="bg" width="800" height="360" fill="#fff"/>
  <text class="t" x="40" y="40" font-size="20" font-weight="700" fill="#171717">The IITM BS PYQ library on BTechi, by level</text>
  <text class="tm" x="40" y="63" font-size="14" fill="#667085">214 papers across 46 courses. Every paper has the official answer key and a printable sheet.</text>
  <!-- Foundation -->
  <g>
    <rect class="bg2" x="40" y="88" width="230" height="220" rx="14" fill="#eef1f4"/>
    <text class="t" x="58" y="116" font-size="16" font-weight="800" fill="#171717">Foundation</text>
    <text class="tm" x="58" y="138" font-size="13" fill="#667085">8 courses</text>
    <text class="t" x="58" y="182" font-size="34" font-weight="800" fill="#171717">72</text>
    <text class="tm" x="118" y="182" font-size="13" fill="#667085">papers</text>
    <rect class="brand" x="58" y="198" width="194" height="26" rx="8" fill="#ffd21c"/>
    <text class="ink" x="68" y="216" font-size="13" font-weight="700" fill="#0b0b0b">Includes 18 qualifier papers</text>
    <text class="tm" x="58" y="250" font-size="12" fill="#667085">Maths I and II, Stats I and II,</text>
    <text class="tm" x="58" y="268" font-size="12" fill="#667085">CT, Python, English I and II</text>
    <text class="tm" x="58" y="290" font-size="12" fill="#667085">Qualifier, Quiz 1, Quiz 2, End term</text>
  </g>
  <!-- Diploma -->
  <g>
    <rect class="bg2" x="285" y="88" width="230" height="220" rx="14" fill="#eef1f4"/>
    <text class="t" x="303" y="116" font-size="16" font-weight="800" fill="#171717">Diploma</text>
    <text class="tm" x="303" y="138" font-size="13" fill="#667085">15 courses</text>
    <text class="t" x="303" y="182" font-size="34" font-weight="800" fill="#171717">76</text>
    <text class="tm" x="363" y="182" font-size="13" fill="#667085">papers</text>
    <rect class="blue" x="303" y="198" width="194" height="26" rx="8" fill="#2563eb"/>
    <text x="313" y="216" font-size="13" font-weight="700" fill="#fff">Programming + Data Science</text>
    <text class="tm" x="303" y="250" font-size="12" fill="#667085">PDSA, DBMS, MAD I and II, Java,</text>
    <text class="tm" x="303" y="268" font-size="12" fill="#667085">MLF, MLT, MLP, BDM, BA, TDS ...</text>
    <text class="tm" x="303" y="290" font-size="12" fill="#667085">Quiz 1, Quiz 2, End term</text>
  </g>
  <!-- Degree -->
  <g>
    <rect class="bg2" x="530" y="88" width="230" height="220" rx="14" fill="#eef1f4"/>
    <text class="t" x="548" y="116" font-size="16" font-weight="800" fill="#171717">Degree</text>
    <text class="tm" x="548" y="138" font-size="13" fill="#667085">23 courses</text>
    <text class="t" x="548" y="182" font-size="34" font-weight="800" fill="#171717">66</text>
    <text class="tm" x="608" y="182" font-size="13" fill="#667085">papers</text>
    <rect class="purple" x="548" y="198" width="194" height="26" rx="8" fill="#7c3aed"/>
    <text x="558" y="216" font-size="13" font-weight="700" fill="#fff">Mostly 2025 terms</text>
    <text class="tm" x="548" y="250" font-size="12" fill="#667085">Deep Learning, LLMs, Computer</text>
    <text class="tm" x="548" y="268" font-size="12" fill="#667085">Vision, Algorithms, OS, Testing ...</text>
    <text class="tm" x="548" y="290" font-size="12" fill="#667085">Quiz 1, Quiz 2, End term</text>
  </g>
  <!-- arrows between levels -->
  <g class="lf" stroke="#171717" stroke-width="2" fill="none">
    <path d="M272 198 L283 198"/>
    <path d="M517 198 L528 198"/>
  </g>
  <text class="tm" x="40" y="340" font-size="11" fill="#667085">Counts of papers on BTechi in October 2026, not all papers IIT Madras has set.</text>
</svg>
